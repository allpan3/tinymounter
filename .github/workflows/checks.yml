name: Checks

on:
  pull_request:

# A newer push to a PR cancels its older check.
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tools/run-checks.sh
    # GitHub's macOS 27 image (public preview).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own commit; GITHUB_SHA is GitHub's merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select Xcode 27.0, the development VM's version
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - run: Tools/run-checks.sh
